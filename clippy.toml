# The start rule (`src/process.rs`): a child of xfx's is made only by
# `process::command` -- which gives a unit test's child the case's fake
# process or nothing -- and started only by `process::spawn`, under the one
# lock every start takes; a pipe is made only by `process::pipe`, under the
# same lock; nothing replaces the process. Checked on the resolved call, so
# an aliased `Command`, a `map(Command::new)`, a `<Command>::new`, a command
# started in a later statement and a `Command::spawn(&mut c)` are each
# caught. `scripts/check-env-reads.py` asserts every entry is here.
#
# The environment rule (`src/lib.rs`'s `process_env!`, `src/test_env.rs`): the
# process environment is read through `process_env!`, so a unit test cannot
# read the real one. Checked on the resolved call, so an imported `var`, an
# aliased `std::env`, a closure over a reader and a reference to one are
# caught as the plain path is -- for the readers named below; a C function
# declared by hand, the `environ` static (a static, which no entry can
# name) and a read of `/proc/self/environ` are not. A read of a named
# reader that stays outside `process_env!` is an `env_exception!`
# (`src/env_exception.rs`), whose names are literals; but for the build
# script, cargo's own process, nothing else lets one through.
# `scripts/check-env-reads.py` runs clippy with the lint forced on, so an
# allow of any spelling hides nothing from it, and holds each `env_exception!`
# to its file and names and each start an allow lets through to a list.
#
# `allow-invalid` marks a path that does not resolve in every build: tokio is
# built without `process`, mio is not a dependency of xfx's own, `vfork`,
# `clone`, `execvpe`, `fexecve` and the variadic `execl*` are not in libc on
# every target, `_NSGetEnviron` is libc's on Apple targets only, and
# `pipe_with` is rustix's only where the system has `pipe2`. Each bites as
# soon as it resolves.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "a child is made by crate::process::command, which gives a unit test's child the case's fake process, never the developer's" },
  { path = "tokio::process::Command::new", reason = "a child is made by crate::process::command, which gives a unit test's child the case's fake process, never the developer's", allow-invalid = true },
  { path = "std::process::Command::spawn", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "std::process::Command::status", reason = "a child is started by crate::process::spawn (or process::status), under the one lock every start takes" },
  { path = "std::process::Command::output", reason = "a child is started by crate::process::spawn (or process::output), under the one lock every start takes" },
  { path = "tokio::process::Command::spawn", reason = "a child is started by crate::process::spawn, under the one lock every start takes", allow-invalid = true },
  { path = "tokio::process::Command::status", reason = "a child is started by crate::process::spawn, under the one lock every start takes", allow-invalid = true },
  { path = "tokio::process::Command::output", reason = "a child is started by crate::process::spawn, under the one lock every start takes", allow-invalid = true },
  { path = "std::os::unix::process::CommandExt::exec", reason = "nothing replaces the process: a start is crate::process::spawn's" },
  { path = "libc::execv", reason = "nothing replaces the process: a start is crate::process::spawn's" },
  { path = "libc::execve", reason = "nothing replaces the process: a start is crate::process::spawn's" },
  { path = "libc::execvp", reason = "nothing replaces the process: a start is crate::process::spawn's" },
  { path = "libc::execvpe", reason = "nothing replaces the process: a start is crate::process::spawn's", allow-invalid = true },
  { path = "libc::fexecve", reason = "nothing replaces the process: a start is crate::process::spawn's", allow-invalid = true },
  { path = "libc::execl", reason = "nothing replaces the process: a start is crate::process::spawn's", allow-invalid = true },
  { path = "libc::execle", reason = "nothing replaces the process: a start is crate::process::spawn's", allow-invalid = true },
  { path = "libc::execlp", reason = "nothing replaces the process: a start is crate::process::spawn's", allow-invalid = true },
  { path = "libc::clone", reason = "a child is started by crate::process::spawn, under the one lock every start takes", allow-invalid = true },
  { path = "libc::fork", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::vfork", reason = "a child is started by crate::process::spawn, under the one lock every start takes", allow-invalid = true },
  { path = "libc::forkpty", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::posix_spawn", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::posix_spawnp", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::popen", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::system", reason = "a child is started by crate::process::spawn, under the one lock every start takes" },
  { path = "libc::pipe", reason = "a pipe is made by crate::process::pipe, so no start's fork lands between the pipe and its close-on-exec" },
  { path = "rustix::pipe::pipe", reason = "a pipe is made by crate::process::pipe, so no start's fork lands between the pipe and its close-on-exec" },
  { path = "rustix::pipe::pipe_with", reason = "a pipe is made by crate::process::pipe, so no start's fork lands between the pipe and its close-on-exec", allow-invalid = true },
  { path = "std::io::pipe", reason = "a pipe is made by crate::process::pipe, so no start's fork lands between the pipe and its close-on-exec" },
  { path = "mio::unix::pipe::new", reason = "a pipe is made by crate::process::pipe, so no start's fork lands between the pipe and its close-on-exec", allow-invalid = true },
  { path = "libc::socketpair", reason = "macOS marks a socket pair close-on-exec only after making it, so a start's fork can hand it to a child: make it in crate::process, under the start lock" },
  { path = "std::os::unix::net::UnixStream::pair", reason = "macOS marks a socket pair close-on-exec only after making it, so a start's fork can hand it to a child: make it in crate::process, under the start lock" },
  { path = "std::os::unix::net::UnixDatagram::pair", reason = "macOS marks a socket pair close-on-exec only after making it, so a start's fork can hand it to a child: make it in crate::process, under the start lock" },
  { path = "std::env::var", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "std::env::var_os", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "std::env::vars", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "std::env::vars_os", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "std::env::home_dir", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "libc::getenv", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one" },
  { path = "libc::_NSGetEnviron", reason = "the process environment is read through process_env! (src/lib.rs), so a unit test cannot read the real one", allow-invalid = true },
  { path = "std::env::temp_dir", reason = "it reads TMPDIR: the process environment is read through process_env! (src/lib.rs) or an env_exception!" },
]

# Compile-time reads: `env!` and `option_env!` bake the compiling shell's
# environment into the binary, a test binary's too. Off in the ordinary run
# (Cargo.toml's `[lints.clippy]`: 76 uses read what cargo and build.rs set);
# `scripts/check-env-reads.py` forces the lint on and lets through only the
# names it lists, and checks rustc's own record of every compile-time read
# (dep-info `# env-dep:`), which also sees one nested in `concat!`.
disallowed-macros = [
  { path = "std::env", reason = "a compile-time read of the environment: scripts/check-env-reads.py lists the names that may be read" },
  { path = "std::option_env", reason = "a compile-time read of the environment: scripts/check-env-reads.py lists the names that may be read" },
  { path = "core::env", reason = "a compile-time read of the environment: scripts/check-env-reads.py lists the names that may be read" },
  { path = "core::option_env", reason = "a compile-time read of the environment: scripts/check-env-reads.py lists the names that may be read" },
]
