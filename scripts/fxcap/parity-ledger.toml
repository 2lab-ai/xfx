[[divergence]]
id = "approval-grant-scope"
class = "deliberate"
pins = ["c1db919"]
scenarios = ["*"]
snaps = ["*"]
fx_row = '^\s+(?:❯ )?2  Apply \+ allow workspace file access for this session$'
xfx_row = '^\s+(?:❯ )?2  Apply \+ allow future (?:edits|writes) to this file for this session$|^  2 = allow every future |^  (?:later )?`xfx ask --resume-id <session-id>` of this saved session$|^  every later `xfx ask --resume-id <session-id>` of this saved session$'
reason = "xfx's grant is this tool on this file (or this exact command in this directory) and outlives the process into a resumed session, so choice 2 says so and a dim `2 = …` row states the scope whole."
owner = "xfx's grant scope (ssot.md:134); the readiness gate requires the scope disclosed"
