# The parity ledger: what scripts/fxcap/sweep.sh may set aside when it
# compares fx's captures with xfx's. Reviewed in pull requests like code;
# scripts/fxcap/ledger.py reads it and its docstring is the format.
#
#   [[pin]]           a reference fx binary, by sha256. A divergence applies
#                     only to the pins it names, so a new oracle starts with
#                     none approved.
#   [[normalization]] a fixed, mechanical rewrite of a row's printed text,
#                     applied before the two sides are compared, in this order.
#                     Only harness artifacts and each product's own name.
#   [[divergence]]    an approved difference, only for a reason outside xfx
#                     (.prd/07-fx-parity-program.md:23): class =
#                     "user-decision" | "unsafe-to-copy" |
#                     "replaced-in-next-pin" | "platform-limit", each with an
#                     owner, a resolution and an expiry, and a `source`
#                     (file:line, checked to exist) that records it.
#   [[cause]]         why an unresolved row is unresolved: it approves
#                     nothing, it only names the owner of the fix. kind =
#                     "decision" | "unit" | "nondeterminism" | "defect".
#
# Anything a normalization does not rewrite and a divergence does not cover
# is an unresolved defect.

[[pin]]
name = "c1db919"
version = "0.0.13"
sha256 = "7b76319a871163ada64d74539ebee592e0e216041cd28465127457500a9be969"
note = "vercel-labs/fx c1db9191 (v0.0.13+33), built locally with zig 0.16.0: Phase 4's oracle (.prd/tui-phase4/ssot.md:6); rebuilt after fx's auto-upgrade overwrote the first build (.prd/07-fx-parity-program.md:19)"

[[pin]]
name = "v0.0.16"
version = "0.0.16"
sha256 = "8e6cda2efddb1d116ccc291e678809b3dd0be342fdb84bbdf3c683d179a3c6a2"
note = "the `fx` entry of the v0.0.16 release asset fx-macos-aarch64.tar.gz, whose sha256 is 2158a8d42e77457a774400d225d9802bb6c0e60a0bb0674a1116bc31252490d6 (.prd/tui-phase4/ssot.md:115: the released binary and its .sha256, no zig 0.17 build)"

# --- normalizations ---------------------------------------------------------

[[normalization]]
id = "banner"
fx = '^𝒇x v\d+\.\d+\.\d+ · Run /help for commands$'
xfx = '^x𝒇x v\S+(?: \[[a-z]+\])? · Run /help for commands$'
replace = "<banner>"
attrs = "none"
why = "Each product's first transcript row names the product and its version: fx `𝒇x v0.0.13`, xfx `x𝒇x v0.1.0-<rev> [debug]` (src/tui/shell.rs:187). The whole row, colours included, is the product's identity, not a screen to match; every receipt leaves it out (the M1 receipt's cells.py, row 1). Matched by its whole text wherever it stands, so a row 1 that is not the banner is compared."
source = [".prd/tui-phase4/ssot.md:26", "src/tui/shell.rs:187", ".prd/tui-phase4/receipts/m1/README.md:49-50"]

[[normalization]]
id = "product-name"
fx = '\bfx\b'
replace = "xfx"
absorb = true
why = "fx's own name, read as xfx on fx's side only: `show the fx version`, `~/.fx/mcp.json`, `.fx.json`, `fx-trace-*.md` are xfx's `xfx` words and paths. One-directional, so an `fx` left on xfx's side stays a difference. Covers the M1 receipt's `/.fx/` rule. The added column may come out of the padding after it (a right-aligned category or warning stays put) or move what follows (prose): either reading equal to xfx's row is the same."
source = [".prd/tui-phase4/receipts/m1/README.md:78-79", "scripts/fxcap/cells.py:12-14"]

[[normalization]]
id = "product-version"
fx = '^(\* version: )\d+\.\d+\.\d+$|^(  build_(?:channel|revision)=)\S+$'
xfx = '^(\* version: )\d+\.\d+\.\d+(?:-\S+)?$|^(  build_(?:channel|revision)=)\S+$'
replace = '\1\2<build>'
why = "The product's own version, build channel and revision, as `/version` and `/status` print them: upstream's shape (`* version: <semver>`, `build_channel=`, `build_revision=`), each product's values (fx 0.0.13 stable c1db919112c5, xfx 0.1.0 debug <rev>). The banner's version is the banner rule's."
source = ["docs/parity.md:118"]

[[normalization]]
id = "panel-build"
fx = '(?<=^  Build {13})\S+(?: · \S+)?$'
xfx = '(?<=^  Build {13})\S+(?: · \S+)?$'
replace = "<build>"
attrs = "none"
why = "The same facts in v0.0.16's `/status` panel: its last row, `Build  <channel> · <rev>` (fx stable 481104fdbc24, xfx debug <rev>). The value only, and without its colour: the two values are different texts, so a cell of one has no cell of the other to take its attributes from; the label before it is compared as painted."
source = ["docs/parity.md:115"]

[[normalization]]
id = "run-directory"
fx = '(?<=fxcap\.)[A-Za-z0-9]{1,6}'
xfx = '(?<=fxcap\.)[A-Za-z0-9]{1,6}'
mask = "X"
why = "capture.sh runs each binary in its own `mktemp -d .../fxcap.XXXXXX`, so a path on screen (/status's workspace, a picker's root) carries a different random suffix on each side. Masked to the same length, so nothing after it moves."
source = ["scripts/fxcap/capture.sh:462"]

[[normalization]]
id = "capture-tmpdir"
fx = '(?<=fxcap\.XXXXXX/)fxtmp\b'
replace = "xfxtmp"
why = "capture.sh gives each binary a TMPDIR inside its run named for the binary, fx `$run/fxtmp`, xfx `$run/xfxtmp`, so where `/trace` says it wrote names the driver's directory, not the product's. After run-directory, on fx's side."
source = ["scripts/fxcap/capture.sh:291-293"]

# Each run's own clock and its own ids. The two binaries run one after the
# other, so what a clock or a random id reads is the run's, not the product's;
# each rule matches its own product's exact shape, so a value in another shape
# is still compared.

[[normalization]]
id = "turn-wall-time"
fx = '^(  )(?:\d+h )?(?:\d+m )?\d+s(?= \(↑\d)'
xfx = '^(  )(?:\d+h )?(?:\d+m )?\d+s(?= \(↑\d)'
replace = '\1<wall>'
why = "The seconds of a turn's summary row (`  2s (↑6 ↓40)`) are the wall time of that run's turn against the fake gateway: they differ by a second between two runs of one binary. The token counts beside them are compared."
source = [".prd/tui-phase4/receipts/f3/README.md:101", ".prd/tui-phase4/receipts/m1/README.md:51"]

[[normalization]]
id = "activity-pulse"
fx = '^[• ](?= (?:Generating|Running|Thinking|Compacting) \(\d)'
xfx = '^[• ](?= (?:Generating|Running|Thinking|Compacting) \(\d)'
replace = "~"
attrs = "none"
why = "The activity row's marker blinks (`•`, then a blank between pulses); a snap catches whichever phase its moment falls on. The marker cell only: the word, its clock and its counts are compared."
source = [".prd/tui-phase4/receipts/d1/README.md:252", ".prd/tui-phase4/receipts/d2c/README.md:146", ".prd/tui-phase4/receipts/f4/README.md:8"]

[[normalization]]
id = "activity-clock"
fx = '^(~ (?:Generating|Running|Thinking|Compacting) \()\d+s(\))'
xfx = '^(~ (?:Generating|Running|Thinking|Compacting) \()\d+s(\))'
replace = '\1<s>\2'
why = "The activity row's seconds count from when that run's turn started, so a snap taken at the same point of the script reads `3s` on one run and `4s` on the next. After activity-pulse (whose `~` it matches); the counts after it are compared."
source = [".prd/tui-phase4/receipts/d2c/README.md:91"]

[[normalization]]
id = "trace-file-name"
fx = '(?<=-trace-)\d{4}-\d{2}-\d{2}-\d{6}-[0-9a-f]{12}(?=\.md\b)'
xfx = '(?<=-trace-)\d{4}-\d{2}-\d{2}-\d{6}-[0-9a-f]{12}(?=\.md\b)'
mask = "X"
why = "`/trace` names its report for the moment it was written and twelve random hex digits (`xfx-trace-YYYY-MM-DD-HHMMSS-<12 hex>.md`); masked to the same length."
source = ["docs/parity.md:107"]

[[normalization]]
id = "network-ms"
fx = '^(\* network: .* · )\d+ms$'
xfx = '^(\* network: .* · )\d+ms$'
replace = '\1<ms>'
why = "A network record's last field is how long that run's request took against the fake gateway."
source = [".prd/tui-phase4/receipts/f5/README.md:38"]

[[normalization]]
id = "transcript-timestamp"
fx = '\b\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}(?= [A-Za-z0-9+-]{1,10}(?: · |$))'
xfx = '\b\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}(?= [A-Za-z0-9+-]{1,10}(?: · |$))'
mask = "X"
why = "The full transcript (Ctrl-O) heads every entry with the moment it was recorded (`  <ts> <zone> · Tool`): the run's clock, masked to the same length. The zone after it -- `UTC`, `KST`, `+0530`, the local zone since v0.0.16's c9bc4876 -- is the product's and is compared."
source = [".prd/tui-phase4/receipts/f5/README.md:38", ".prd/tui-phase4/receipts/f5/README.md:49", "docs/parity.md:238"]

[[normalization]]
id = "tmux-dead-pane"
fx = '^(Pane is dead \(status \d+, ).*(\))$'
xfx = '^(Pane is dead \(status \d+, ).*(\))$'
replace = '\1<tmux clock>\2'
why = "tmux's own line under a pane whose program has exited (capture.sh `keep`) ends with tmux's clock; the exit status before it is compared."
source = [".prd/tui-phase4/receipts/d1/README.md:145", ".prd/tui-phase4/receipts/p1/README.md:32", "scripts/fxcap/capture.sh:878"]

[[normalization]]
id = "session-id"
fx = '(?<=--resume )[A-Za-z0-9_-]{12}(?![A-Za-z0-9_-])|(?<=^  Session {11})[A-Za-z0-9_-]{12}(?= · )'
xfx = '\b\d{13}-[0-9a-f]{16}\b'
replace = "<session-id>"
why = "A session's id is minted per run: fx's twelve characters (`--resume 9yclcdoOjcsQ`, and v0.0.16's `/status` panel row `Session  <id> · …`), xfx's milliseconds and sixteen hex digits. Each side's own shape only."
source = [".prd/tui-phase4/receipts/p1/README.md:32", "docs/parity.md:210", "docs/parity.md:115"]

# --- divergences ------------------------------------------------------------
#
# Each is scoped to the c1db919 pin, expires at the v0.0.16 pin (the next
# delta re-approves it or not) and names its owner. Re-filed 2026-11-03 under
# the program's four reasons; a user-decision entry needs the decision
# recorded as the user's (program :55, ssot.md's G/X rows, open-loop #88).
# What fit none is an unresolved defect now, labelled under [[cause]] below:
# the approval grant scope and the second-model image route (decisions not
# yet asked), Sound level's `max`, the terminal tool's header and deadline,
# the retry budget, the session record's lines, the picker's `gateway` label.
#
# Not seeded: ssot.md "Deliberate xfx divergences this workstream reverses"
# (:34-46), divergences the phase removes.

