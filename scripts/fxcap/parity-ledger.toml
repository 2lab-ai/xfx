[[divergence]]
id = "terminal-tool-deadline"
class = "deliberate"
pins = ["c1db919"]
scenarios = ["timeout"]
snaps = ["*"]
fx_row = 'echo started; sleep 5\b'
xfx_row = 'echo started; sleep 130\b'
reason = "The scenario runs past each tool's deadline: fx's per-call `timeout_ms` of one second against `sleep 5`, xfx's fixed two-minute ceiling against `sleep 130` (timeout.cap). The command is each product's."
owner = "xfx's tool set (docs/parity.md:158)"
expires = "a decision to port fx's per-call timeout"
source = ["docs/parity.md:158"]

[[divergence]]
id = "skills-roots"
