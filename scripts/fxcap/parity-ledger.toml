[[divergence]]
id = "inline-band-row-anchor"
class = "unsafe-to-copy"
pins = ["v0.0.16"]
scenarios = ["p5-ctrlo-wider-inline-fam"]
snaps = ["prompt", "margin", "resized"]
fx_row = '^┃ fam \u261d '
xfx_row = '^┃ fam \u261d .*y a\ufe0fb '
reason = "Observed in fx v0.0.16's wire, not traced through its presenter: the card of a sent prompt, written again in bold after Enter, carries the anchor fx writes after a glyph with a variation selector (`engine.zig:2586-2588@481104fd`) -- `ESC[23;3H`, `ESC[1m`, `fam` U+261D ... `a` U+FE0F, `ESC[17G`, `b` ... in `fx/p5-ctrlo-wider-inline-fam-40x120/fx-p5-ctrlo-wider-inline-fam-40x120-prompt.wire` (.prd/tui-phase5/receipts/ctrlo-wider/), as the answer's row before it does in the same file. With a scalar before it that a terminal draws wider than the count (`src/tui/drawn_wider.rs`), the anchor puts the cursor back over glyphs already drawn and the glyphs after it overwrite them: the card (`fam` U+261D U+2E3A U+1F590 `x` U+E0002 `y a` U+FE0F `b` ...) reads `fam ☝ ⸺ 🖐 x` U+E0002 `b  c  d  e` on tmux 3.7b and loses its `a` on libghostty-vt 1.3.2. xfx writes the card as a document row, as it stands (`src/tui/frame.rs`'s `place`; ENGINE-VS-ANCHOR's decision 2, `.prd/tui-phase5/receipts/engine-vs-anchor/README.md`), so every glyph stays on both terminals, shifted as the terminal draws it (`fam ☝ ⸺ 🖐 x` U+E0002 `y a️b ­️c ﾠ️d ￰️e`; measure.txt, the card of the sent prompt); copying fx's write would lose them. Both write the scalars themselves: the card is the prompt as the user typed it, as the composer is (the cause `composer-drawn-wider`). An answer's rows are named (`answer-drawn-wider-named`), so this is the card's alone."
owner = "CTRLO-WIDER"
resolution = "fx stops anchoring over a glyph a terminal drew wider than its count, in a later pin, so the rows are the same"
expires = "date:2026-12-04"
source = ["src/tui/frame.rs:2749", "docs/parity.md:237"]

