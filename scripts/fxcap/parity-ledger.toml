[[divergence]]
id = "terminal-tool"
class = "deliberate"
pins = ["c1db919"]
scenarios = ["*"]
snaps = ["*"]
fx_row = '\$ # shell\.run profile=user shell=\S+$|^\s*│?\s*(?:action: run|yield_time_ms|timeout_ms)\b'
xfx_row = '\$ # terminal\.exec cwd=\S+$'
reason = "fx's `shell` tool (`action: run`, per-call `timeout_ms`) is xfx's `terminal` (`action: exec`, `command`, `cwd`, one fixed ceiling): a tool-set difference, so the review header and Ctrl-O's argument rows name each product's tool."
owner = "xfx's tool set (docs/parity.md:158)"
expires = "a decision to port fx's shell tool schema"
