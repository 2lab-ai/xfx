"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: CI

# One run per branch or pull request. A superseded run proves nothing about the
# commit that replaced it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: gate (${{ matrix.part && format('{0}, {1}', matrix.target, matrix.part) || matrix.target }})
    runs-on: ${{ matrix.runner }}
    # The timeout is here to stop a hung job, not to bound a slow runner. The
    # x86_64 macOS row's whole gate, in one job, measured 41.5 to 53.1 minutes
    # over PRs #78 to #83 (2026-11-08), so that row is two jobs now (`part`,
    # below); each runs about half of it.
    timeout-minutes: 60
    env:
      # The commit this run is a receipt for. On `pull_request` the default
      # checkout is GitHub's synthetic merge commit, which exists in no branch,
      # is recomputed whenever the base moves, and is what `build.rs` would then
      # stamp into the binary -- so a green run would name a revision nobody can
      # check out. The gate has to be the pull request's head.
      COMMIT_UNDER_TEST: >-
        ${{ github.event_name == 'pull_request'
        && github.event.pull_request.head.sha
        || github.sha }}
    strategy:
      fail-fast: false
      # Every supported target has a native GitHub-hosted runner, so this
      # matrix is four real machines rather than three plus a cross-compile.
      # That matters here: xfx's acceptance tests open pseudoterminals, send
      # signals, take advisory locks, and run child processes, none of which a
      # cross-built binary can exercise. `ubuntu-24.04-arm` and
      # `macos-15-intel` are free for public repositories; if either becomes
      # unavailable, the honest change is to drop that row and stop shipping
      # its archive, not to replace it with a build that is never run.
      #
      # `script_tests` marks one row per OS for the tests of the gate scripts
      # themselves (test-gate-env.sh, which runs test-check-no-secrets.sh,
      # test-preview-contract.sh and test-check-no-local-paths.sh). They exercise the OS's bash, grep, git
      # and getconf -- bash 3.2 and BSD grep on macOS, GNU grep on Linux --
      # and build nothing for the target, so a second row of the same OS
      # repeats them on the same userland. On the x86_64 macOS row they would
      # have cost minutes against its 60-minute timeout (PR #80: 47m29s). The
      # gates themselves (every check-*.sh) still run on every row.
      #
      # `part` splits one target's gate over two jobs on two runners of the
      # same label, both on the commit under test: `checks` runs the steps up
      # to the preview contract, `release` the release-mode steps from the
      # output-cost check on. A row without `part` runs both, in one job. The
      # x86_64 macOS row is the only one split: its single job had reached
      # 53.1 minutes of 60 (PR #82), 17.5 of them the output-cost step, whose
      # two release `cargo test --lib` builds no other step can share. A split
      # costs a second runner, its setup and its own dependency builds, and the
      # release part builds the debug `--lib` tests check-usage-clock.sh runs;
      # the other rows have room and keep one job each, because GitHub-hosted
      # macOS runners are scarce (`macos-15` jobs have been cancelled waiting
      # for one). A split row carries `script_tests` on its `checks` part only.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script_tests: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
            script_tests: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            part: checks
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            part: release
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_UNDER_TEST }}

      # `build.rs` resolves the revision with `git rev-parse HEAD`, so the
      # checkout above is also what ends up in `xfx status`. Asserting it here
      # rather than trusting the `ref:` means a checkout that silently landed
      # somewhere else fails before any gate can pass on the wrong source.
      - name: Confirm the checkout is the commit under test
        run: |
          set -eu
          # Git reads its repository, index and config from GIT_*; none of a caller's.
          for name in "${!GIT_@}"; do case "$name" in *[!A-Za-z0-9_]*) ;; *) unset "$name" ;; esac; done
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$COMMIT_UNDER_TEST" ]; then
            echo "checked out $actual, expected $COMMIT_UNDER_TEST" >&2
            exit 1
          fi
          echo "gate is running on $actual"

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Confirm the runner really is this target
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "runner host is $host, matrix says ${{ matrix.target }}" >&2
            exit 1
          fi

      - name: Formatting
        if: matrix.part != 'release'
        run: cargo fmt --check

      - name: Lints
        if: matrix.part != 'release'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        if: matrix.part != 'release'
        run: cargo test --locked --all-targets

      # Two kinds of row need the fault injector: restoration-matrix rows that
      # only a deliberate failure can drive -- a panic while the terminal is raw,
      # an initialization that dies on either side of raw mode -- and the lib unit
      # rows whose fault seams are compiled out of every shipped build. The
      # integration invocation runs the first kind and the `--lib` invocation the
      # second; neither runs the other's rows. The local common gate runs both
      # too, and this job is what proves them on every native target.
      - name: Tests, with the fault injector
        if: matrix.part != 'release'
        run: |
          cargo clippy --locked --all-targets --features fault-injection -- -D warnings
          cargo test --locked --features fault-injection --test tui
          cargo test --locked --lib --features fault-injection

      - name: No stubs, and the parity ledger reconciles
        if: matrix.part != 'release'
        run: ./scripts/check-no-stubs.sh

      - name: No credentials in tracked files
        if: matrix.part != 'release'
        run: ./scripts/check-no-secrets.sh

      # The repository is public, and captures, receipts and scripts written
      # on a worker's machine carried its scratch root and home into it
      # (LOCAL-PATHS, 2026-11-09). The check refuses those paths by shape,
      # never by one machine's name.
      - name: No path of one machine in tracked files
        if: matrix.part != 'release'
        run: ./scripts/check-no-local-paths.sh

      # The check plants every shape in every kind of file, and the forms
      # that must pass, under the environment variables and config that
      # could make it read another tree; one row per OS, as the other script
      # tests, because it exercises the OS's bash and git.
      - name: The local-path check refuses what it exists for
        if: matrix.script_tests
        run: ./scripts/test-check-no-local-paths.sh

      # BSD grep, on the macOS rows, puts GREP_OPTIONS in front of every
      # argument list, so a gate that decides by grep would decide by that
      # variable; and git takes its repository, index and config from GIT_*
      # and from config the gates do not own. Each gate drops them; this
      # plants one violation per gate and requires it refused under the
      # value that used to hide it.
      #
      # It is also the one run of scripts/test-check-no-secrets.sh,
      # whole, under a decoy GIT_DIR, a GIT_TRACE and a HOME whose config
      # runs programs: the secrets check hands the tracked names to `grep`
      # in batches that fit under ARG_MAX, and that test builds a scratch
      # tree past one command line and requires the check to read all of
      # it -- a key in the first, the last and every file reported, a file
      # it cannot read a failure. It used to run on its own as well, a
      # second full run per row; the two differed only in the environment,
      # and the run under the decoys is the one that tests it.
      - name: No gate takes its options, repository or config from the environment
        if: matrix.script_tests
        run: ./scripts/test-gate-env.sh

      - name: One product name in tracked files
        if: matrix.part != 'release'
        run: ./scripts/check-xfx-identity.sh

      # The publishing workflow cannot be tested by running it: a merge to main
      # that bumps `.github/preview-epoch` is what runs it, and by then a broken
      # tag grammar or a missing asset is a release users can see. Its structure
      # is checked here instead.
      - name: The preview publication contract holds
        if: matrix.part != 'release'
        run: ./scripts/check-preview-contract.sh

      # The contract check is only worth its `ok` if it still fails what it
      # was written to fail. This breaks the trigger, the epoch gate, the
      # condition on the jobs behind it, and the epoch file, one at a time in
      # a scratch copy, and requires each break to be reported by name.
      - name: The preview contract catches every mutant it exists for
        if: matrix.script_tests
        run: ./scripts/test-preview-contract.sh

      # The TUI output check runs in front of every frame a released binary
      # writes, so its cost is a property of the product rather than a number in
      # a report. It is measured here and nowhere else in this file: the two
      # timing tests assert only under optimization, and the script runs them
      # one at a time -- an elapsed time taken inside the parallel suite above
      # includes whatever else the runner was doing, which is how a 20 ms case
      # was once recorded at 133 ms. Running them alone does not give them the
      # machine; it removes the one confound this repository controls.
      - name: The output check still fits inside a frame's budget
        if: matrix.part != 'checks'
        run: ./scripts/check-tui-preflight-cost.sh

      # The `@` picker searches its whole index again on every keystroke, on
      # the thread that paints, so one keystroke's search is held to the 8 ms
      # frame over fx's own 100,000-entry benchmark. Measured here for the
      # same reasons as the output check: release, and alone. The script
      # prints the load beside the figures.
      - name: The @ search still fits inside a frame
        if: matrix.part != 'checks'
        run: ./scripts/check-at-search-cost.sh

      # `XFX_E2E_USAGE_CLOCK_FILE` pins /usage's clock for the capture harness
      # (src/usage/clock.rs), and only a build with debug assertions reads it.
      # That is a property of the build profile, so the one test that knows
      # both halves runs under each: debug, and the two release builds this
      # job makes. The release runs reuse the test builds the step above made.
      - name: A release build ignores the pinned usage clock
        if: matrix.part != 'checks'
        run: ./scripts/check-usage-clock.sh

      - name: Release build
        if: matrix.part != 'checks'
        run: cargo build --locked --release

      - name: Smoke the release binary
        if: matrix.part != 'checks'
        run: ./scripts/smoke.sh target/release/xfx "${RUNNER_TEMP}/xfx-smoke"

      - name: Keep the smoke evidence of a failed run
        if: failure() && matrix.part != 'checks'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/xfx-smoke
          if-no-files-found: ignore
          retention-days: 7

      # The restoration matrix the TUI gate drives has rows only a deliberate
      # failure can reach, and it drives them against a *release* build of the
      # same source. Built into its own target directory so the binary the
      # previous step smoked is still the one a release would ship.
      - name: Build the binary the restoration matrix drives
        if: matrix.part != 'checks'
        run: cargo build --locked --release --features fault-injection --target-dir target/faulty

      - name: Smoke the TUI on a real terminal
        if: matrix.part != 'checks'
        run: |
          ./scripts/smoke-tui.sh target/release/xfx \
            --faulty target/faulty/release/xfx \
            "${RUNNER_TEMP}/xfx-smoke-tui"

      - name: Keep the TUI evidence of a failed run
        if: failure() && matrix.part != 'checks'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tui-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/xfx-smoke-tui
          if-no-files-found: ignore
          retention-days: 7
