[package]
name = "xfx"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Unofficial Apache-2.0 Rust port of the fx terminal coding agent"
license = "Apache-2.0"
repository = "https://github.com/2lab-ai/xfx"
publish = false

[[bin]]
name = "xfx"
path = "src/main.rs"

[lib]
name = "xfx"
path = "src/lib.rs"

[features]
# Deliberate failures the terminal-restoration matrix has to drive: a panic on
# the thread that owns the terminal, and an initialization that fails on either
# side of raw mode. Off by default, so a release build contains none of it; CI
# runs the acceptance suite once more with it on.
fault-injection = []

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
# ripgrep's walker: bounded, deterministic when sorted, does not follow
# symlinks, and applies `.gitignore`, so glob and grep see the files a developer
# considers part of the project rather than every build artifact.
ignore = "0.4"
# rustls only: TLS must never depend on an ambient system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SHA-256 over file contents. A mutation authority is only as strong as the
# preimage it names, so a preimage is identified by digest as well as by
# device/inode, and the digest is re-derived immediately before the rename.
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
# The awaitable half of cancellation. An `AtomicBool` cannot be awaited: a task
# parked on a full channel or a quiet socket needs a future that *wakes* it, and
# polling a flag between awaits cannot do that. `default-features = false` keeps
# it to `sync::CancellationToken`.
tokio-util = { version = "0.7", default-features = false }
# Grapheme motion and cell width. Measurement and painting must agree cell for
# cell or the band's geometry lies about where the cursor is.
unicode-segmentation = "1"
unicode-width = "0.2"

# Directory-descriptor traversal, process-group signalling, and the terminal the
# TUI borrows and gives back. A mutation resolves its target component by
# component with `openat(..., O_NOFOLLOW)`, so no component can be substituted
# between the check and the write; a timed-out command is killed by process
# group, so a grandchild cannot outlive it holding the pipe xfx is reading;
# `termios` is how raw mode is entered and left on the exact descriptor it was
# captured from, and `event`, `pipe`, and `stdio` are the input loop's `poll(2)`,
# its self-pipe wakeup, and the standard descriptors it polls. `std` exposes
# none of these.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = [
  "fs",
  "process",
  "termios",
  "event",
  "pipe",
  "stdio",
] }
# POSIX signal dispositions. rustix exposes no portable `sigaction` (its
# `runtime` module is Linux-only and explicitly internal), and the TUI's restore
# contract is written in handlers: `sigaction` without `SA_RESTART`, `raise`,
# and a `write(2)` that is async-signal-safe. Already in the lock file as a
# transitive dependency of rustix; this makes it direct.
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

# The interactive shell is only meaningful on a terminal, so its acceptance
# tests drive the real binary through a real pseudoterminal rather than through
# a pipe that merely claims to be one. `pty` opens the device pair and `termios`
# reads the line-discipline state back, which is how "xfx left your terminal as
# it found it" becomes an assertion instead of a hope. Test-only: a release
# build links neither.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }

[profile.release]
strip = true
