[package]
name = "fxr"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Unofficial Apache-2.0 Rust port of the fx terminal coding agent"
license = "Apache-2.0"
repository = "https://github.com/2lab-ai/fxr"
publish = false

[[bin]]
name = "fxr"
path = "src/main.rs"

[lib]
name = "fxr"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
# ripgrep's walker: bounded, deterministic when sorted, does not follow
# symlinks, and applies `.gitignore`, so glob and grep see the files a developer
# considers part of the project rather than every build artifact.
ignore = "0.4"
# rustls only: TLS must never depend on an ambient system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SHA-256 over file contents. A mutation authority is only as strong as the
# preimage it names, so a preimage is identified by digest as well as by
# device/inode, and the digest is re-derived immediately before the rename.
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }

# Directory-descriptor traversal. A mutation resolves its target component by
# component with `openat(..., O_NOFOLLOW)`, so no component can be substituted
# between the check and the write. `std::fs` exposes no path-relative `openat`,
# and this is the one place fxr needs one.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
strip = true
